name: Deploy Web to Production (aki.is-a.dev)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Test Suite & Migration Validation
        run: pnpm test

      # Deployment Step 1: D1 Database Migrations (Schema first)
      - name: Apply D1 Database Migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @folium/worker run d1:migrate:prod

      # Deployment Step 2: Edge Worker API (API second)
      - name: Deploy Cloudflare Worker API
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @folium/worker run deploy

      # Deployment Step 3: Web Application (Client last)
      - name: Build Web App
        env:
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: pnpm --filter @folium/mobile exec expo export --platform web

      - name: Prepare SPA Fallback & Metadata
        run: |
          cp apps/mobile/dist/index.html apps/mobile/dist/404.html
          echo "aki.is-a.dev" > apps/mobile/dist/CNAME
          touch apps/mobile/dist/.nojekyll
          cp README_DEPLOY.md apps/mobile/dist/README.md

      - name: Deploy to Folio (aki.is-a.dev)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          external_repository: dannie203/Folio
          publish_branch: main
          publish_dir: ./apps/mobile/dist
          cname: aki.is-a.dev
          commit_message: "deploy(prod): automated build from folium@${{ github.sha }}"
